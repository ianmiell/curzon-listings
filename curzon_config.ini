; Config for the Curzon listings web app. Re-read on every request and scrape,
; so edits apply without a restart. Committed and public: no secrets here.

[curzon]
; Curzon site IDs to scrape. All sites: /health lists the configured ones, and
; https://digital-api.curzon.com/ocapi/v1/sites (needs a token) lists every one.
sites = ALD1,BLO1,CAM1,HOX1,MAY1,SOH1,VIC1
; Minutes between scrapes (minimum 10). Each one runs headless Chrome once,
; only when the API token is near expiry, plus one API call per screening date.
refresh_minutes = 60

[venue_notes]
; Shown under each cinema in the "By cinema" view and in the footer. Once notes
; are saved from the /notes page, data/venue_notes.json replaces this section.
SOH1 = Screen 2 back is good. Screen 3 front good, back bad.
VIC1 = Screen 2 back a bit cramped, front looked OK.
HOX1 = Screen 1 back good.
