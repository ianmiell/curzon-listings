# Paste inside the ianmiell.com server block, replacing any static
# /curzon-listings location. The app builds its links from X-Forwarded-Prefix.
location = /curzon-listings { return 301 /curzon-listings/; }
location /curzon-listings/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /curzon-listings;
    proxy_pass http://127.0.0.1:6752/;
}
