# Paste inside the ianmiell.com server block, replacing any static
# /curzon-listings location. The app builds its links from X-Forwarded-Prefix.
#
# nginx listens on 8443 behind the router's 443, so a relative `return 301`
# becomes https://ianmiell.com:8443/..., which isn't reachable from outside and
# hangs. Redirect to an explicit URL (or set `port_in_redirect off;` in the
# server block, which also fixes the /mcp redirects).
location = /curzon-listings { return 301 https://$host/curzon-listings/; }
location /curzon-listings/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /curzon-listings;
    proxy_pass http://127.0.0.1:6752/;
}
